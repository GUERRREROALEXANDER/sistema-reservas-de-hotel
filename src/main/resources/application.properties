spring.application.name=hotel-reservation-system

# Railway injects PORT at runtime; 8080 is the local fallback
server.port=${PORT:8080}
server.error.include-message=always

# High season months (1-12). Nights falling in these months cost base price * multiplier
hotel.pricing.high-season-months=6,7,12
hotel.pricing.high-season-multiplier=1.5

management.endpoints.web.exposure.include=health,info
